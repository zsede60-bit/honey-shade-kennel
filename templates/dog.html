{% extends "base.html" %}{% block content %}<section class="section"><div class="form">{% if dog.image %}<img style="width:100%;max-height:620px;object-fit:cover" src="{{url_for('static',filename=dog.image)}}" alt="{{dog.name}}">{% endif %}<h2 style="text-align:left">{{dog.name}}</h2><p><b>{{dog.sex}}</b>{% if dog.age %} · {{dog.age}}{% endif %}</p><p style="line-height:1.8">{{dog.description}}</p></div></section>{% endblock %}
