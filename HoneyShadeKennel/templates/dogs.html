{% extends "base.html" %}{% block content %}<section class="section"><h2>Kutyáink</h2><p class="intro">Tenyészetünk kutyáinak bemutatása.</p><div class="cards">{% for d in dogs %}<article class="card">{% if d.image %}<img src="{{url_for('static',filename=d.image)}}" alt="{{d.name}}">{% endif %}<h3>{{d.name}}</h3><p>{{d.sex}}{% if d.age %} · {{d.age}}{% endif %}</p><p>{{d.description}}</p><a class="btn" href="{{url_for('dog',dog_id=d.id)}}">RÉSZLETEK</a></article>{% endfor %}</div></section>{% endblock %}
